<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>赛博迷宫·撤离点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0c0f;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }
        .game-wrapper {
            position: relative;
            background: #000;
            box-shadow: 0 0 40px #00ffff88, 0 0 15px #ff00ff;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a0c0f;
            cursor: crosshair;
            touch-action: none;
        }
        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            color: #0ff;
            text-shadow: 0 0 8px #0ff, 0 0 16px #0ff;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            z-index: 10;
        }
        .hud-left, .hud-right {
            display: flex;
            gap: 20px;
            background: rgba(0, 20, 20, 0.6);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #0ff;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px #0ff8;
        }
        .hp-bar {
            color: #f0f;
            text-shadow: 0 0 8px #f0f, 0 0 16px #f0f;
        }
        .ammo {
            color: #ffaa00;
            text-shadow: 0 0 8px #ffaa00, 0 0 16px #ffaa00;
        }
        .restart-tip {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            background: #000a;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #0ff;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
            z-index: 20;
            opacity: 0.8;
            font-size: 14px;
            white-space: nowrap;
        }
        /* 虚拟摇杆 */
        .joystick-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(0, 255, 255, 0.08);
            border-radius: 50%;
            border: 2px solid #0ff8;
            box-shadow: 0 0 20px #0ff8, inset 0 0 20px #0ff4;
            z-index: 15;
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin-left: -25px;
            margin-top: -25px;
            background: #0ff;
            border-radius: 50%;
            box-shadow: 0 0 25px #0ff, 0 0 45px #0ff;
            border: 2px solid #fff;
            transition: transform 0.02s;
            pointer-events: none;
        }
        .shoot-button {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #ff00ff80, #ff00ff20);
            border: 3px solid #ff00ff;
            border-radius: 50%;
            box-shadow: 0 0 30px #ff00ff, inset 0 0 20px #ff00ff;
            z-index: 15;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 22px;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff00ff;
            letter-spacing: 2px;
            transition: 0.1s;
        }
        .shoot-button:active {
            background: radial-gradient(circle, #ff00ff, #ff00ff80);
            box-shadow: 0 0 50px #ff00ff, inset 0 0 30px #fff;
            transform: scale(0.95);
        }
        .msg-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            text-align: center;
            background: #000a;
            padding: 20px 40px;
            border-radius: 60px;
            border: 3px solid #0ff;
            box-shadow: 0 0 60px #0ff;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .msg-overlay.show {
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div class="hud">
        <div class="hud-left">
            <span class="hp-bar">❤️ <span id="hpDisplay">100</span></span>
            <span>💊 <span id="medkitDisplay">0</span></span>
        </div>
        <div class="hud-right">
            <span class="ammo">🔫 <span id="ammoDisplay">∞</span></span>
        </div>
    </div>
    <div class="joystick-area" id="joystickArea">
        <div class="joystick-knob" id="joystickKnob"></div>
    </div>
    <div class="shoot-button" id="shootBtn">🔫</div>
    <div class="restart-tip" id="restartTip">点击屏幕重新开始</div>
    <div class="msg-overlay" id="msgOverlay"></div>
</div>
<script>
    (function() {
        // ---------- 配置 ----------
        const MAP_COLS = 80;
        const MAP_ROWS = 60;
        const TILE_SIZE = 32;
        const WORLD_WIDTH = MAP_COLS * TILE_SIZE;
        const WORLD_HEIGHT = MAP_ROWS * TILE_SIZE;

        // 画布视口尺寸 (固定逻辑分辨率)
        const VIEW_WIDTH = 1280;
        const VIEW_HEIGHT = 720;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 设置画布物理尺寸与逻辑尺寸一致 (但CSS会自适应)
        canvas.width = VIEW_WIDTH;
        canvas.height = VIEW_HEIGHT;

        // HUD 元素
        const hpDisplay = document.getElementById('hpDisplay');
        const medkitDisplay = document.getElementById('medkitDisplay');
        const ammoDisplay = document.getElementById('ammoDisplay');
        const msgOverlay = document.getElementById('msgOverlay');
        const restartTip = document.getElementById('restartTip');

        // 摇杆和射击
        const joystickArea = document.getElementById('joystickArea');
        const joystickKnob = document.getElementById('joystickKnob');
        const shootBtn = document.getElementById('shootBtn');

        // ---------- 游戏状态 ----------
        let gameActive = true;
        let win = false;
        let lose = false;

        // 玩家属性
        let player = {
            x: 64,
            y: 64,
            radius: 12,
            speed: 3.2,
            hp: 100,
            maxHp: 100,
            medkits: 2,
            ammo: 30,
            maxAmmo: 60,
            angle: 0,
            invincible: false,
            invTimer: 0
        };

        // 摄像机
        let camera = { x: 0, y: 0 };

        // 输入
        let moveVec = { x: 0, y: 0 };
        let shootPressed = false;
        let lastShootTime = 0;
        const SHOOT_COOLDOWN = 200; // ms
        let mouseAngle = 0; // 用于鼠标瞄准

        // 摇杆
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        let joystickCenter = { x: 0, y: 0 };
        const JOYSTICK_RADIUS = 55;

        // 子弹
        let bullets = [];
        const BULLET_SPEED = 7;
        const BULLET_RADIUS = 5;
        const BULLET_DAMAGE = 25;
        const BULLET_LIFETIME = 60; // 帧数

        // 敌人
        let enemies = [];
        const ENEMY_SPEED = 1.3;
        const ENEMY_RADIUS = 14;
        const ENEMY_HP = 50;
        const ENEMY_ATTACK_COOLDOWN = 40; // 帧数
        const ENEMY_DAMAGE = 12;

        // 障碍物 (墙体) 二维网格: 0 = 空地, 1 = 墙
        let grid = [];
        // 武器补给
        let pickups = [];

        // 撤离点
        let extractionPoint = { x: WORLD_WIDTH - 80, y: WORLD_HEIGHT - 80, radius: 38 };

        // 帧计时器
        let lastTime = 0;
        let deltaTime = 0;
        let frameCount = 0;

        // 用于生成地图的种子 (固定种子保证每次布局相似但不同)
        let seed = 12345;
        function random() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }

        // ---------- 地图生成 ----------
        function generateMap() {
            grid = Array(MAP_ROWS).fill().map(() => Array(MAP_COLS).fill(0));
            
            // 随机墙体 (使用随机游走+房间风格)
            // 1. 边框
            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    if (r === 0 || r === MAP_ROWS - 1 || c === 0 || c === MAP_COLS - 1) {
                        grid[r][c] = 1;
                    }
                }
            }

            // 2. 内部随机障碍块 (使用柏林噪声简化版: 多频叠加)
            for (let r = 2; r < MAP_ROWS - 2; r++) {
                for (let c = 2; c < MAP_COLS - 2; c++) {
                    // 留出出生区域和撤离区域
                    if (c < 8 && r < 8) continue;
                    if (c > MAP_COLS - 10 && r > MAP_ROWS - 10) continue;

                    // 使用多个正弦函数叠加制造复杂迷宫感
                    const v1 = Math.sin(c * 0.3) * Math.cos(r * 0.25);
                    const v2 = Math.sin(c * 0.7 + 1.2) * Math.cos(r * 0.6 + 0.8);
                    const v3 = Math.sin(c * 0.15 + 2.0) * Math.sin(r * 0.45 + 1.5);
                    const noise = v1 * 0.6 + v2 * 0.3 + v3 * 0.1;
                    
                    if (noise > 0.35) {
                        grid[r][c] = 1;
                    }
                }
            }

            // 3. 确保通路: 打通一些路径 (增加随机连通)
            for (let r = 4; r < MAP_ROWS - 4; r+=2) {
                for (let c = 4; c < MAP_COLS - 4; c+=2) {
                    if (random() > 0.6) {
                        grid[r][c] = 0;
                    }
                }
            }

            // 4. 清除玩家出生点周围
            for (let r = 1; r <= 5; r++) {
                for (let c = 1; c <= 5; c++) {
                    grid[r][c] = 0;
                }
            }
            // 清除撤离点周围
            const ex = Math.floor((WORLD_WIDTH - 80) / TILE_SIZE);
            const ey = Math.floor((WORLD_HEIGHT - 80) / TILE_SIZE);
            for (let r = ey-3; r <= ey+1; r++) {
                for (let c = ex-3; c <= ex+1; c++) {
                    if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
                        grid[r][c] = 0;
                    }
                }
            }

            // 5. 生成武器补给 (随机空地)
            pickups = [];
            let tries = 0;
            while (pickups.length < 12 && tries < 500) {
                tries++;
                const c = Math.floor(Math.random() * (MAP_COLS - 4)) + 2;
                const r = Math.floor(Math.random() * (MAP_ROWS - 4)) + 2;
                if (grid[r][c] === 0) {
                    // 避免与出生点/撤离点太近
                    const wx = c * TILE_SIZE + TILE_SIZE/2;
                    const wy = r * TILE_SIZE + TILE_SIZE/2;
                    if (Math.hypot(wx - 64, wy - 64) < 100) continue;
                    if (Math.hypot(wx - extractionPoint.x, wy - extractionPoint.y) < 150) continue;
                    pickups.push({
                        x: wx, y: wy,
                        type: Math.random() < 0.7 ? 'ammo' : 'medkit',
                        collected: false,
                        radius: 12,
                        bob: Math.random() * Math.PI * 2
                    });
                }
            }

            // 6. 生成敌人 (避开玩家出生点)
            enemies = [];
            tries = 0;
            while (enemies.length < 25 && tries < 800) {
                tries++;
                const c = Math.floor(Math.random() * (MAP_COLS - 4)) + 2;
                const r = Math.floor(Math.random() * (MAP_ROWS - 4)) + 2;
                if (grid[r][c] === 0) {
                    const wx = c * TILE_SIZE + TILE_SIZE/2;
                    const wy = r * TILE_SIZE + TILE_SIZE/2;
                    if (Math.hypot(wx - 64, wy - 64) < 200) continue; // 远离出生点
                    if (Math.hypot(wx - extractionPoint.x, wy - extractionPoint.y) < 150) continue;
                    enemies.push({
                        x: wx, y: wy,
                        hp: ENEMY_HP,
                        maxHp: ENEMY_HP,
                        attackTimer: 0,
                        angle: 0,
                        radius: ENEMY_RADIUS,
                        speed: ENEMY_SPEED * (0.8 + Math.random() * 0.6)
                    });
                }
            }

            // 重置玩家位置 (若重新开始)
            player.x = 64;
            player.y = 64;
            player.hp = 100;
            player.medkits = 2;
            player.ammo = 30;
            player.invincible = false;
            player.invTimer = 0;
        }

        // 初始化地图
        function initGame() {
            seed = 12345 + (gameActive ? 0 : Date.now() % 1000); // 变化
            generateMap();
            bullets = [];
            gameActive = true;
            win = false;
            lose = false;
            msgOverlay.classList.remove('show');
            restartTip.style.opacity = '0.8';
            player.hp = 100;
            player.medkits = 2;
            player.ammo = 30;
            player.invincible = false;
            player.invTimer = 0;
            camera.x = player.x - VIEW_WIDTH / 2;
            camera.y = player.y - VIEW_HEIGHT / 2;
            clampCamera();
        }

        // 碰撞检测: 圆形与地图网格
        function isCollidingWithMap(x, y, radius) {
            const minCol = Math.floor((x - radius) / TILE_SIZE);
            const maxCol = Math.floor((x + radius) / TILE_SIZE);
            const minRow = Math.floor((y - radius) / TILE_SIZE);
            const maxRow = Math.floor((y + radius) / TILE_SIZE);
            
            for (let r = minRow; r <= maxRow; r++) {
                for (let c = minCol; c <= maxCol; c++) {
                    if (r < 0 || r >= MAP_ROWS || c < 0 || c >= MAP_COLS) return true;
                    if (grid[r][c] === 1) {
                        // 检测圆与瓦片碰撞
                        const tileX = c * TILE_SIZE;
                        const tileY = r * TILE_SIZE;
                        const closestX = Math.max(tileX, Math.min(x, tileX + TILE_SIZE));
                        const closestY = Math.max(tileY, Math.min(y, tileY + TILE_SIZE));
                        const dx = x - closestX;
                        const dy = y - closestY;
                        if (dx * dx + dy * dy < radius * radius) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // 摄像机限制
        function clampCamera() {
            camera.x = Math.max(0, Math.min(WORLD_WIDTH - VIEW_WIDTH, camera.x));
            camera.y = Math.max(0, Math.min(WORLD_HEIGHT - VIEW_HEIGHT, camera.y));
        }

        // ---------- 更新逻辑 ----------
        function update(dt) {
            if (!gameActive) return;

            // 玩家移动 (来自摇杆或键盘)
            let dx = 0, dy = 0;
            if (joystickActive) {
                dx = joystickVector.x;
                dy = joystickVector.y;
            } else {
                // 键盘 (WASD / 方向键)
                if (keys['w'] || keys['arrowup']) dy -= 1;
                if (keys['s'] || keys['arrowdown']) dy += 1;
                if (keys['a'] || keys['arrowleft']) dx -= 1;
                if (keys['d'] || keys['arrowright']) dx += 1;
                // 归一化
                const len = Math.hypot(dx, dy);
                if (len > 0) {
                    dx /= len;
                    dy /= len;
                }
            }

            // 移动玩家并碰撞
            if (dx !== 0 || dy !== 0) {
                const moveX = dx * player.speed;
                const moveY = dy * player.speed;
                // 分轴移动
                let newX = player.x + moveX;
                if (!isCollidingWithMap(newX, player.y, player.radius)) {
                    player.x = newX;
                }
                let newY = player.y + moveY;
                if (!isCollidingWithMap(player.x, newY, player.radius)) {
                    player.y = newY;
                }
                // 朝向角度更新 (如果移动)
                if (Math.hypot(dx, dy) > 0.1) {
                    player.angle = Math.atan2(dy, dx);
                }
            }

            // 鼠标瞄准角度 (如果鼠标在canvas内移动)
            // 射击时已处理

            // 无敌帧递减
            if (player.invincible) {
                player.invTimer -= dt;
                if (player.invTimer <= 0) {
                    player.invincible = false;
                }
            }

            // 射击 (鼠标或按钮)
            const now = performance.now();
            if (shootPressed && now - lastShootTime > SHOOT_COOLDOWN && player.ammo > 0) {
                lastShootTime = now;
                player.ammo--;
                // 发射子弹
                const angle = player.angle; // 使用玩家朝向
                bullets.push({
                    x: player.x + Math.cos(angle) * (player.radius + 5),
                    y: player.y + Math.sin(angle) * (player.radius + 5),
                    vx: Math.cos(angle) * BULLET_SPEED,
                    vy: Math.sin(angle) * BULLET_SPEED,
                    radius: BULLET_RADIUS,
                    life: BULLET_LIFETIME,
                    damage: BULLET_DAMAGE
                });
                // 更新弹药显示
                updateHUD();
            }

            // 子弹更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                // 检查地图碰撞
                if (b.life <= 0 || isCollidingWithMap(b.x, b.y, b.radius)) {
                    bullets.splice(i, 1);
                    continue;
                }

                // 检查敌人碰撞
                let hitEnemy = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < b.radius + e.radius) {
                        e.hp -= b.damage;
                        hitEnemy = true;
                        if (e.hp <= 0) {
                            enemies.splice(j, 1);
                            // 有几率掉落补给
                            if (Math.random() < 0.25) {
                                pickups.push({
                                    x: e.x, y: e.y,
                                    type: Math.random() < 0.6 ? 'ammo' : 'medkit',
                                    collected: false,
                                    radius: 12,
                                    bob: Math.random() * Math.PI * 2
                                });
                            }
                        }
                        break;
                    }
                }
                if (hitEnemy) {
                    bullets.splice(i, 1);
                }
            }

            // 敌人 AI 更新
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                // 向玩家移动
                const dxToPlayer = player.x - e.x;
                const dyToPlayer = player.y - e.y;
                const distToPlayer = Math.hypot(dxToPlayer, dyToPlayer);
                if (distToPlayer > 0) {
                    const moveX = (dxToPlayer / distToPlayer) * e.speed;
                    const moveY = (dyToPlayer / distToPlayer) * e.speed;
                    
                    // 分轴碰撞
                    if (!isCollidingWithMap(e.x + moveX, e.y, e.radius)) {
                        e.x += moveX;
                    }
                    if (!isCollidingWithMap(e.x, e.y + moveY, e.radius)) {
                        e.y += moveY;
                    }
                }

                // 攻击冷却
                if (e.attackTimer > 0) {
                    e.attackTimer--;
                }

                // 攻击玩家
                if (distToPlayer < player.radius + e.radius + 5 && e.attackTimer <= 0) {
                    if (!player.invincible) {
                        player.hp -= ENEMY_DAMAGE;
                        player.invincible = true;
                        player.invTimer = 30; // 0.5秒无敌
                        e.attackTimer = ENEMY_ATTACK_COOLDOWN;
                        updateHUD();
                        if (player.hp <= 0) {
                            player.hp = 0;
                            gameActive = false;
                            lose = true;
                            showMessage('💀 系统崩溃 💀');
                        }
                    }
                }
            }

            // 拾取物品
            for (let i = pickups.length - 1; i >= 0; i--) {
                const p = pickups[i];
                if (p.collected) continue;
                const dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < player.radius + p.radius) {
                    if (p.type === 'ammo') {
                        player.ammo = Math.min(player.maxAmmo, player.ammo + 15);
                    } else {
                        player.medkits += 1;
                        if (player.hp < player.maxHp) {
                            player.hp = Math.min(player.maxHp, player.hp + 30);
                        }
                    }
                    pickups.splice(i, 1);
                    updateHUD();
                }
            }

            // 检查撤离点
            const distToExtract = Math.hypot(player.x - extractionPoint.x, player.y - extractionPoint.y);
            if (distToExtract < extractionPoint.radius) {
                gameActive = false;
                win = true;
                showMessage('✨ 撤离成功 ✨');
            }

            // 更新摄像机 (跟随玩家)
            camera.x = player.x - VIEW_WIDTH / 2;
            camera.y = player.y - VIEW_HEIGHT / 2;
            clampCamera();

            // 更新武器补给旋转
            pickups.forEach(p => p.bob += 0.05);

            // 更新 HUD
            updateHUD();
        }

        function updateHUD() {
            hpDisplay.textContent = Math.max(0, Math.floor(player.hp));
            medkitDisplay.textContent = player.medkits;
            ammoDisplay.textContent = player.ammo;
        }

        function showMessage(text) {
            msgOverlay.textContent = text;
            msgOverlay.classList.add('show');
            restartTip.style.opacity = '0';
        }

        // ---------- 渲染 ----------
        function render() {
            ctx.clearRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            // 绘制网格地面 (赛博朋克网格线)
            ctx.save();
            const offsetX = -camera.x;
            const offsetY = -camera.y;

            // 背景
            ctx.fillStyle = '#0a0c0f';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            // 绘制网格线
            ctx.strokeStyle = '#00ffff22';
            ctx.lineWidth = 1;
            const startCol = Math.floor(camera.x / TILE_SIZE);
            const endCol = Math.ceil((camera.x + VIEW_WIDTH) / TILE_SIZE);
            const startRow = Math.floor(camera.y / TILE_SIZE);
            const endRow = Math.ceil((camera.y + VIEW_HEIGHT) / TILE_SIZE);
            
            for (let c = startCol; c <= endCol; c++) {
                const x = c * TILE_SIZE - camera.x;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, VIEW_HEIGHT);
                ctx.strokeStyle = '#00ffff18';
                ctx.stroke();
            }
            for (let r = startRow; r <= endRow; r++) {
                const y = r * TILE_SIZE - camera.y;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(VIEW_WIDTH, y);
                ctx.strokeStyle = '#00ffff18';
                ctx.stroke();
            }

            // 绘制墙体 (障碍)
            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    if (r < 0 || r >= MAP_ROWS || c < 0 || c >= MAP_COLS) continue;
                    if (grid[r][c] === 1) {
                        const x = c * TILE_SIZE - camera.x;
                        const y = r * TILE_SIZE - camera.y;
                        // 霓虹风格墙体
                        ctx.fillStyle = '#0a1a2a';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        // 边框
                        ctx.strokeStyle = '#00ffff';
                        ctx.lineWidth = 2;
                        ctx.shadowColor = '#00ffff';
                        ctx.shadowBlur = 12;
                        ctx.strokeRect(x+1, y+1, TILE_SIZE-2, TILE_SIZE-2);
                        // 内部线条
                        ctx.shadowBlur = 8;
                        ctx.strokeStyle = '#ff00ff80';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x+4, y+4, TILE_SIZE-8, TILE_SIZE-8);
                        ctx.shadowBlur = 0; // 重置
                    }
                }
            }

            // 绘制撤离点
            const ex = extractionPoint.x - camera.x;
            const ey = extractionPoint.y - camera.y;
            if (ex > -100 && ex < VIEW_WIDTH + 100 && ey > -100 && ey < VIEW_HEIGHT + 100) {
                const pulse = Math.sin(Date.now() * 0.005) * 5;
                ctx.shadowColor = '#00ffaa';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(ex, ey, extractionPoint.radius + pulse, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffaa40';
                ctx.fill();
                ctx.strokeStyle = '#00ffaa';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 16px "Courier New"';
                ctx.fillStyle = '#00ffaa';
                ctx.shadowColor = '#00ffaa';
                ctx.shadowBlur = 20;
                ctx.fillText('撤离点', ex - 35, ey - 45);
                ctx.shadowBlur = 0;
            }

            // 绘制拾取物
            pickups.forEach(p => {
                const px = p.x - camera.x;
                const py = p.y - camera.y;
                if (px < -50 || px > VIEW_WIDTH + 50 || py < -50 || py > VIEW_HEIGHT + 50) return;
                const bobY = Math.sin(p.bob) * 4;
                ctx.shadowColor = p.type === 'ammo' ? '#ffaa00' : '#ff44ff';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(px, py + bobY, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.type === 'ammo' ? '#ffaa00' : '#ff44ff';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                // 符号
                ctx.font = 'bold 14px "Courier New"';
                ctx.fillStyle = '#000';
                ctx.shadowBlur = 0;
                ctx.fillText(p.type === 'ammo' ? 'A' : 'M', px - 5, py + bobY + 5);
            });

            // 绘制敌人
            enemies.forEach(e => {
                const ex = e.x - camera.x;
                const ey = e.y - camera.y;
                if (ex < -50 || ex > VIEW_WIDTH + 50 || ey < -50 || ey > VIEW_HEIGHT + 50) return;
                // 敌人光晕
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(ex, ey, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff000080';
                ctx.fill();
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.stroke();
                // 血条
                const hpPercent = e.hp / e.maxHp;
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#333';
                ctx.fillRect(ex - 18, ey - e.radius - 12, 36, 5);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(ex - 18, ey - e.radius - 12, 36 * hpPercent, 5);
            });

            // 绘制子弹
            bullets.forEach(b => {
                const bx = b.x - camera.x;
                const by = b.y - camera.y;
                if (bx < -20 || bx > VIEW_WIDTH + 20 || by < -20 || by > VIEW_HEIGHT + 20) return;
                ctx.shadowColor = '#ffff00';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(bx, by, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffff00';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // 绘制玩家
            const px = player.x - camera.x;
            const py = player.y - camera.y;
            // 无敌闪烁
            if (player.invincible && Math.floor(frameCount / 5) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            // 玩家光晕
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(px, py, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#00ffff80';
            ctx.fill();
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            // 朝向指示
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px + Math.cos(player.angle) * (player.radius + 12), py + Math.sin(player.angle) * (player.radius + 12));
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // 绘制准星/鼠标方向 (可选)
            
            ctx.restore();

            // 如果游戏结束，叠加提示
            if (lose) {
                ctx.fillStyle = '#000000aa';
                ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
            } else if (win) {
                ctx.fillStyle = '#00ffaa22';
                ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
            }
        }

        // ---------- 主循环 ----------
        function gameLoop(now) {
            deltaTime = Math.min(100, now - lastTime) / 1000; // 秒
            lastTime = now;
            frameCount++;

            if (gameActive) {
                update(deltaTime);
            }

            render();

            requestAnimationFrame(gameLoop);
        }

        // ---------- 输入处理 ----------
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            // 防止页面滚动
            if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // 鼠标移动控制朝向
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseCanvasX = (e.clientX - rect.left) * scaleX;
            const mouseCanvasY = (e.clientY - rect.top) * scaleY;
            const worldX = mouseCanvasX + camera.x;
            const worldY = mouseCanvasY + camera.y;
            player.angle = Math.atan2(worldY - player.y, worldX - player.x);
        });

        // 鼠标射击
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                shootPressed = true;
            }
        });
        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                shootPressed = false;
            }
        });
        canvas.addEventListener('mouseleave', () => {
            shootPressed = false;
        });

        // 触摸射击按钮
        shootBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            shootPressed = true;
            // 触摸射击时朝摇杆方向或者玩家当前朝向
            // 如果摇杆激活，用摇杆方向；否则用玩家当前朝向
            if (joystickActive && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
                player.angle = Math.atan2(joystickVector.y, joystickVector.x);
            }
            // 立即触发一次射击 (让反馈更快)
            if (gameActive && player.ammo > 0) {
                const now = performance.now();
                if (now - lastShootTime > SHOOT_COOLDOWN) {
                    lastShootTime = now;
                    player.ammo--;
                    const angle = player.angle;
                    bullets.push({
                        x: player.x + Math.cos(angle) * (player.radius + 5),
                        y: player.y + Math.sin(angle) * (player.radius + 5),
                        vx: Math.cos(angle) * BULLET_SPEED,
                        vy: Math.sin(angle) * BULLET_SPEED,
                        radius: BULLET_RADIUS,
                        life: BULLET_LIFETIME,
                        damage: BULLET_DAMAGE
                    });
                    updateHUD();
                }
            }
        }, { passive: false });

        shootBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            shootPressed = false;
        });
        shootBtn.addEventListener('touchcancel', (e) => {
            shootPressed = false;
        });

        // 虚拟摇杆
        joystickArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = joystickArea.getBoundingClientRect();
            const touch = e.touches[0];
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            joystickCenter.x = centerX;
            joystickCenter.y = centerY;
            joystickActive = true;
            updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });

        joystickArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (joystickActive && e.touches.length > 0) {
                const touch = e.touches[0];
                updateJoystick(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        joystickArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            joystickActive = false;
            joystickVector = { x: 0, y: 0 };
            joystickKnob.style.transform = `translate(0px, 0px)`;
        });

        joystickArea.addEventListener('touchcancel', (e) => {
            joystickActive = false;
            joystickVector = { x: 0, y: 0 };
            joystickKnob.style.transform = `translate(0px, 0px)`;
        });

        function updateJoystick(clientX, clientY) {
            const dx = clientX - joystickCenter.x;
            const dy = clientY - joystickCenter.y;
            const dist = Math.hypot(dx, dy);
            const maxDist = JOYSTICK_RADIUS;
            let normX = dx / maxDist;
            let normY = dy / maxDist;
            if (dist > maxDist) {
                normX = dx / dist;
                normY = dy / dist;
            }
            joystickVector.x = normX;
            joystickVector.y = normY;
            // 限制旋钮位置
            const knobX = normX * maxDist * 0.7;
            const knobY = normY * maxDist * 0.7;
            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

            // 更新玩家朝向 (摇杆方向即朝向)
            if (Math.hypot(normX, normY) > 0.1) {
                player.angle = Math.atan2(normY, normX);
            }
        }

        // 点击重新开始
        canvas.addEventListener('click', (e) => {
            if (!gameActive && (win || lose)) {
                initGame();
            }
        });

        // 防止触摸页面滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.game-wrapper')) {
                e.preventDefault();
            }
        }, { passive: false });

        // 初始化并启动
        initGame();
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
        updateHUD();

        // 窗口大小自适应保留比例 (CSS已处理)
    })();
</script>
</body>
</html>
